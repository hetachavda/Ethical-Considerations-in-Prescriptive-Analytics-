<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a3aa7"/>
      <stop offset="100%" stop-color="#1baf7a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#3a5a68" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- balance scale motif: Efficiency vs Welfare -->
  <g filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 -22" to="0 0" begin="0.2s" dur="0.8s" fill="freeze"/>

    <!-- base + post -->
    <rect x="945" y="256" width="90" height="8" rx="4" fill="#7fa9bd"/>
    <polygon points="972,256 1008,256 990,238" fill="#7fa9bd"/>
    <line x1="990" y1="238" x2="990" y2="112" stroke="#9fc6d8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="990" cy="110" r="7" fill="#eda100"/>

    <!-- tilting beam with pans -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 990 110; -5 990 110; 0 990 110; 5 990 110; 0 990 110"
        begin="1.1s" dur="5s" repeatCount="indefinite"/>
      <rect x="878" y="106" width="224" height="8" rx="4" fill="url(#accent)"/>
      <!-- left pan: Efficiency -->
      <line x1="890" y1="112" x2="890" y2="150" stroke="#9fc6d8" stroke-width="2"/>
      <path d="M862 150 Q890 182 918 150" fill="#2a78d6" fill-opacity="0.85" stroke="#8fc0f2" stroke-width="1.5"/>
      <text x="890" y="142" font-size="12" font-weight="600" fill="#eaf3ff" text-anchor="middle">Profit</text>
      <!-- right pan: Welfare -->
      <line x1="1090" y1="112" x2="1090" y2="150" stroke="#9fc6d8" stroke-width="2"/>
      <path d="M1062 150 Q1090 182 1118 150" fill="#1baf7a" fill-opacity="0.85" stroke="#8fe0c4" stroke-width="1.5"/>
      <text x="1090" y="142" font-size="12" font-weight="600" fill="#eafff5" text-anchor="middle">Welfare</text>
    </g>
  </g>

  <!-- principle chips -->
  <g font-size="13" font-weight="600" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.8s" fill="freeze"/>
    <rect x="836" y="272" width="94" height="26" rx="13" fill="#1baf7a" opacity="0.9"/>
    <text x="883" y="290" fill="#0b0b0b" text-anchor="middle">Fairness</text>
    <rect x="938" y="272" width="86" height="26" rx="13" fill="#2a78d6" opacity="0.9"/>
    <text x="981" y="290" fill="#ffffff" text-anchor="middle">Privacy</text>
    <rect x="1032" y="272" width="132" height="26" rx="13" fill="#4a3aa7" opacity="0.9"/>
    <text x="1098" y="290" fill="#ffffff" text-anchor="middle">Accountability</text>
  </g>

  <rect x="70" y="96" width="8" height="128" rx="4" fill="url(#accent)"/>
  <text x="105" y="128" font-size="42" font-weight="700" fill="#ffffff">Ethics in Prescriptive Analytics</text>
  <text x="105" y="172" font-size="21" font-weight="400" fill="#c4bdf0">Optimising responsibly — Linear Integer Programming &amp; human welfare</text>

  <g font-size="16" font-weight="600">
    <rect x="105" y="200" width="205" height="34" rx="17" fill="#4a3aa7" opacity="0.9"/>
    <text x="207" y="223" fill="#ffffff" text-anchor="middle">LIP · Branch &amp; Bound</text>
    <rect x="322" y="200" width="185" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="414" y="223" fill="#cfeefc" text-anchor="middle">Fairness · Privacy</text>
    <rect x="519" y="200" width="150" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="594" y="223" fill="#cfeefc" text-anchor="middle">Case Study</text>
  </g>

  <text x="105" y="285" font-size="15" fill="#7fa9bd">Optimization · Data Ethics · Multi-Objective Design   |   Heta Chavda — Data Analytics Portfolio</text>

  <rect x="-260" y="0" width="260" height="320" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" from="-260" to="1300" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
